<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Farm Week Roster</title>
<style>
  :root {
    --walnut: #4a2e1b; --wood: #a8743f; --barn: #c8372d; --meadow: #8cd15a; --wheat: #f6c744;
    --cream: #fff6e0; --ink: #2b1a10; --chalk: #f3eedc; --board: #2e4a38; --muted: #e8d9bc;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; background: transparent; color: #fff;
    font-family: "Avenir Next", -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  .wrap { padding: 4px 2px 16px; }
  .painted { font-family: "American Typewriter", Georgia, serif; font-weight: 700; letter-spacing: .3px;
    text-shadow: 1.5px 1.5px 0 var(--ink), -1px -1px 0 var(--ink), 0 3px 4px rgba(43,26,16,.35); }
  .chalk { font-family: "Chalkboard SE", "Marker Felt", sans-serif; font-weight: 700; }
  .theme { border: 4px solid var(--ink); border-radius: 18px; padding: 12px 14px; background: var(--walnut);
    box-shadow: 0 4px 0 rgba(43,26,16,.35); margin-bottom: 14px; }
  .theme .label { font-size: 13px; color: var(--wheat); }
  .theme h2 { margin: 2px 0 4px; font-size: 24px; color: var(--wheat); }
  .theme p { margin: 0; color: var(--cream); font-size: 15px; }
  .preview { font-size: 12px; color: var(--ink); background: var(--cream); border: 3px dashed var(--barn); border-radius: 10px;
    padding: 7px 10px; margin-bottom: 12px; line-height: 1.35; }
  h3 { margin: 18px 4px 8px; font-size: 22px; color: var(--cream); }
  .board { background: var(--board); border: 8px solid var(--wood); border-radius: 16px; padding: 6px 10px; box-shadow: 0 4px 0 rgba(43,26,16,.35); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(243,238,220,.25); }
  .row:last-child { border-bottom: none; }
  .rank { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font: 700 17px "Chalkboard SE", sans-serif; color: var(--ink); background: var(--muted); border: 2px solid var(--ink); }
  .r1 .rank { background: var(--wheat); }
  .r2 .rank, .r3 .rank { background: var(--meadow); }
  .hen { width: 38px; height: 38px; flex: none; }
  .name { flex: 1; font: 700 16px "Chalkboard SE", sans-serif; color: var(--chalk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me .name { color: var(--wheat); }
  .score { font: 700 17px "Chalkboard SE", sans-serif; color: var(--chalk); }
  .empty { color: var(--chalk); padding: 14px 4px; font: 15px "Chalkboard SE", sans-serif; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { border: 3px solid var(--ink); border-radius: 14px; padding: 10px 6px; text-align: center; background: var(--walnut); }
  .slot .ranks { font: 700 13px "Chalkboard SE", sans-serif; color: var(--wheat); }
  .slot .title { font-weight: 800; font-size: 14px; margin: 4px 0; color: var(--cream); }
  .slot .coins { font: 700 14px "Chalkboard SE", sans-serif; color: var(--wheat); }
  .slot .state { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .flowers { display: flex; justify-content: space-between; padding: 10px 8px; background: var(--walnut);
    border-radius: 14px; border: 3px solid var(--ink); }
  .flower { width: 32px; height: 48px; position: relative; }
  .flower .stem { position: absolute; left: 14px; top: 20px; width: 4px; height: 28px; background: #4e9a33; }
  .flower .head { position: absolute; left: 3px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #6b5a48; border: 3px solid #8a7a66; }
  .flower.on .head { background: #6b3e1e; border: 6px solid #ffc83d; }
  .foot { color: var(--cream); font-size: 13px; margin: 8px 4px 0; line-height: 1.4; text-shadow: 0 1px 2px rgba(43,26,16,.7); }
</style>
</head>
<body>
<div class="wrap">
  <div class="theme">
    <div class="label chalk" id="week">THIS WEEK</div>
    <h2 class="painted" id="themeTitle">Farm Week</h2>
    <p id="themeDetail"></p>
  </div>
  <div class="preview chalk" id="notice" hidden></div>

  <h3 class="painted">TOP 5 THIS WEEK</h3>
  <div class="board" id="board"><div class="empty">Loading the roster…</div></div>

  <h3 class="painted">WEEKLY REWARDS</h3>
  <div class="slots" id="slots"></div>

  <h3 class="painted">SUNFLOWER ROW</h3>
  <div class="flowers" id="flowers"></div>
  <p class="foot" id="flowerText"></p>
</div>
<script>
  // The app replaces the placeholders below with the LeaderboardPage JSON and hen portraits (see RosterWebView).
  const ROSTER_DATA = /*ROSTER_DATA*/null;
  const HEN_IMAGES = /*HEN_IMAGES*/{};
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderBoard(data) {
    document.getElementById('week').textContent = data.weekKey + ' · ' + data.daysLeft + (data.daysLeft === 1 ? ' DAY LEFT' : ' DAYS LEFT');
    document.getElementById('themeTitle').textContent = data.themeTitle;
    document.getElementById('themeDetail').textContent = data.themeDetail;
    const notice = document.getElementById('notice');
    notice.hidden = !data.isPreview;
    notice.textContent = data.notice;

    const board = document.getElementById('board');
    if (!data.entries.length) {
      board.innerHTML = '<div class="empty">No runs this week yet.</div>';
    } else {
      board.innerHTML = data.entries.map(e =>
        '<div class="row r' + e.rank + (e.isPlayer ? ' me' : '') + '">' +
        '<div class="rank">' + e.rank + '</div>' +
        '<img class="hen" src="' + (HEN_IMAGES[e.hen] || '') + '" alt="">' +
        '<div class="name">' + esc(e.name) + '</div>' +
        '<div class="score">' + e.score.toLocaleString('en-US') + '</div></div>').join('');
    }

    document.getElementById('slots').innerHTML = data.rewards.map(r =>
      '<div class="slot"><div class="ranks">#' + esc(r.ranks) + '</div><div class="title">' + esc(r.title) +
      '</div><div class="coins">' + r.coins + ' coins</div><div class="state">' +
      (data.isPreview ? 'Opens with the live roster' : 'Paid on Monday') + '</div></div>').join('');

    let flowers = '';
    for (let i = 0; i < data.sunflowersPerWeek; i++) {
      flowers += '<div class="flower' + (i < data.sunflowersLit ? ' on' : '') + '"><div class="stem"></div><div class="head"></div></div>';
    }
    document.getElementById('flowers').innerHTML = flowers;
    document.getElementById('flowerText').textContent =
      data.sunflowersLit + ' of ' + data.sunflowersPerWeek + ' sunflowers in bloom. Every day you play, one more opens along the fence.';
  }
  if (ROSTER_DATA) { renderBoard(ROSTER_DATA); }
</script>
</body>
</html>
